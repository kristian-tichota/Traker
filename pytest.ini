[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers -m "not perf"
markers =
    exact: mirrors a @exact scenario in specs/features — the numbers are the spec, do not relax the assertion
    accessibility: mirrors a @accessibility scenario — exists because of the keystroke-cost constraint
    gap: mirrors a @gap scenario — a verified defect; these are xfail(strict) until the code catches up
    gui: needs a QApplication (runs under QT_QPA_PLATFORM=offscreen, set by tests/conftest.py)
    perf: a benchmark against a seeded ledger, not a correctness test — deselected by default (pytest -m perf)
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
